[package]
name = "facts"
version = "0.5.4"
edition = "2024"
description = "A CLI for fact-driven development with coding agents"
license = "MIT"
repository = "https://github.com/av/facts"
authors = ["av <av@av.codes>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dhat = { version = "0.3", optional = true }

[features]
dhat = ["dep:dhat"]

[[bin]]
name = "facts"
path = "src/main.rs"

[[bin]]
name = "facts-dhat"
path = "src/main.rs"
required-features = ["dhat"]

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
dhat = "0.3"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
debug = true
